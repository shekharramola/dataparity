[project]
name = "dataparity"
version = "0.1.0"
description = "Local-first structured data quality and change analysis platform"
readme = "README.md"
authors = [
    { name = "Shekhar Ramola", email = "shekharramola2012@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
]

[project.scripts]
dataparity = "dataparity:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
