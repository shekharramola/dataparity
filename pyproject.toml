[project]
name = "dataparity"
version = "0.1.0"
description = "Local-first structured data quality and change analysis platform"
readme = "README.md"
authors = [
    { name = "Shekhar Ramola", email = "shekhar.ramola.cse@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]
[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
